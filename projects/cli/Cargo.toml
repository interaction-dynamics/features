[package]
name = "features-cli"
version = "0.15.0"
edition = "2024"
description = "Map every feature in your codebase: ownership, test coverage, tech debt and git history, as a CLI and web dashboard. Works with any language."
license = "MIT"
homepage = "https://github.com/interaction-dynamics/features"
repository = "https://github.com/interaction-dynamics/features"
documentation = "https://github.com/interaction-dynamics/features/blob/master/docs/cli.md"
readme = "../../README.md"
keywords = ["codeowners", "architecture", "technical-debt", "ownership", "feature-based"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Interaction Dynamics <thibault.friedrich@interaction-dynamics.io>"]
include = ["build.rs", "src", "public", "!public/features.json", "skills"]

[lib]
name = "features_cli"
path = "src/lib.rs"

[[bin]]
name = "features"
test = false
bench = false
path = "src/bin.rs"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.2"
colored = "3.1"
# Only local repositories are read, so the network transports (https/ssh) and
# their OpenSSL/libssh2 dependencies are not needed
git2 = { version = "0.21", default-features = false }
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }
warp = { version = "0.4", features = ["server"] }
include_dir = "0.7"
notify = "8.2"
indicatif = "0.18"
walkdir = "2.0"
indexmap = { version = "2.0", features = ["serde"] }

[dev-dependencies]
warp = { version = "0.4", features = ["test"] }
tempfile = "3.0"
