name: Valide Code
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  validate-web:
    name: Validate UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        name: Install pnpm
        with:
          version: 10
          run_install: false
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install 🔧
        run: pnpm install
      - name: Build 🔧
        run: pnpm build
      - name: Format 👕
        run: |
          pnpm format
          pnpm lint
      - name: Unit Tests ✔️
        run: pnpm test:coverage

  validate-cli:
    name: Validate CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/cli
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # Fetches the entire history of the repository
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check Formatting 👕
        run: cargo fmt --all -- --check
      - name: Prepare public folder
        run: mkdir -p public
      - name: Clippy 🔍
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build 🔧
        run: cargo build --verbose
      - name: Test ✔️
        run: cargo test --verbose

  e2e-tests:
    name: End-to-end Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Setup Rust for building features.json and metadata.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        name: Cache Rust dependencies
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            projects/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare rust public folder
        working-directory: ./projects/cli
        run: mkdir -p public

      # Build the CLI to generate features.json and metadata.json
      - name: Build CLI 🔧
        working-directory: ./projects/cli
        run: cargo build --release

      # Ensure public directory exists
      - name: Create public directory 📁
        working-directory: ./projects/web
        run: mkdir -p public

      # Generate features JSON
      - name: Generate features data 📊
        working-directory: ./projects/cli
        run: |
          if [ ! -d "../../examples/tests-skip-changes/" ]; then
            echo "Error: javascript-karge example directory not found"
            exit 1
          fi
          cargo run --release -- ../../examples/tests-skip-changes/src --project-dir ../../examples/tests-skip-changes --json > ../web/public/features.json
          if [ ! -s "../web/public/features.json" ]; then
            echo "Error: features.json was not generated or is empty"
            exit 1
          fi
          echo "Generated features.json with $(wc -l < ../web/public/features.json) lines"

      # Generate metadata.json with version from Cargo.toml
      - name: Generate metadata.json 📋
        working-directory: ./projects/cli
        run: |
          VERSION=$(grep "^version" Cargo.toml | head -n1 | cut -d'"' -f2)
          echo "{\"version\": \"$VERSION\", \"repository\": \"git@github.com:interaction-dynamics/features.git\" }" > ../web/public/metadata.json
          echo "Generated metadata.json with version: $VERSION"

      # Setup Node.js for web app
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        working-directory: ./projects/web
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install web dependencies 🔧
        working-directory: ./projects/web
        run: pnpm install

      - name: Install Playwright browsers 🎭
        working-directory: ./projects/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests ✔️
        working-directory: ./projects/web
        run: pnpm test:e2e

      - name: Upload test results 📤
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-report
          path: projects/web/playwright-report/
          retention-days: 30
