name: Valide Code
on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  # Detect which projects changed so each validation job only runs when needed.
  # Jobs are skipped with a job-level `if`, which GitHub reports as a success,
  # so required status checks keep passing when a project is untouched.
  # Changing this workflow file, or a manual run, validates everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cli == 'true' }}
      cli-deps: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cli-deps == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      website: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.website == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - '.github/workflows/validate.yml'
            cli:
              - *workflow
              - 'projects/cli/**'
              # The Claude skills are embedded in the binary (features skills install)
              - 'projects/skills/**'
              # CLI unit and integration tests read fixtures from examples/
              - 'examples/**'
            cli-deps:
              - *workflow
              - 'projects/cli/Cargo.toml'
              - 'projects/cli/Cargo.lock'
              - 'projects/cli/deny.toml'
            web:
              - *workflow
              - 'projects/web/**'
            website:
              - *workflow
              - 'projects/website/**'
            e2e:
              - *workflow
              # e2e runs the web app against features.json generated by the CLI
              - 'projects/cli/**'
              - 'projects/web/**'
              - 'examples/tests-skip-changes/**'

  validate-web:
    name: Validate UI
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: projects/web/package.json
      - name: Setup Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install 🔧
        run: bun install --frozen-lockfile
      - name: Build 🔧
        run: bun run build
      - name: Format 👕
        run: |
          bun run format:check
          bun run lint
      - name: Unit Tests ✔️
        run: bun run test:coverage

  validate-website:
    name: Validate Website
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: projects/website/package.json
      - name: Setup Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install 🔧
        run: bun install --frozen-lockfile
      - name: Build 🔧
        run: bun run build
      - name: Format 👕
        run: |
          bun run format:check
          bun run lint

  validate-cli:
    name: Validate CLI
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetches the entire history of the repository
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Caches ~/.cargo and projects/cli/target, keyed per job, and falls back
      # to the previous cache when Cargo.lock changes.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: projects/cli
      - name: Check Formatting 👕
        run: cargo fmt --all -- --check
      - name: Prepare public folder
        run: mkdir -p public
      - name: Clippy 🔍
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build 🔧
        run: cargo build --verbose
      - name: Test ✔️
        run: cargo test --verbose

  audit-cli:
    name: Audit CLI dependencies
    needs: changes
    if: needs.changes.outputs.cli-deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails on RustSec advisories (vulnerable, unmaintained or yanked crates).
      # Accepted advisories are listed in projects/cli/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: projects/cli/Cargo.toml
          command: check advisories

  e2e-tests:
    name: End-to-end Tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04 # Playwright 1.57 has no chromium build for ubuntu 26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Setup Rust for building features.json and metadata.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: projects/cli

      - name: Prepare rust public folder
        working-directory: ./projects/cli
        run: mkdir -p public

      # Build the CLI to generate features.json and metadata.json
      - name: Build CLI 🔧
        working-directory: ./projects/cli
        run: cargo build --release

      # Ensure public directory exists
      - name: Create public directory 📁
        working-directory: ./projects/web
        run: mkdir -p public

      # Generate features JSON
      - name: Generate features data 📊
        working-directory: ./projects/cli
        run: |
          if [ ! -d "../../examples/tests-skip-changes/" ]; then
            echo "Error: javascript-karge example directory not found"
            exit 1
          fi
          cargo run --release -- ../../examples/tests-skip-changes/src --project-dir ../../examples/tests-skip-changes --json > ../web/public/features.json
          if [ ! -s "../web/public/features.json" ]; then
            echo "Error: features.json was not generated or is empty"
            exit 1
          fi
          echo "Generated features.json with $(wc -l < ../web/public/features.json) lines"

      # Generate metadata.json with version from Cargo.toml
      # The end-to-end tests run with the experimental pages (History, project records in Outside features)
      - name: Generate metadata.json 📋
        working-directory: ./projects/cli
        run: |
          VERSION=$(grep "^version" Cargo.toml | head -n1 | cut -d'"' -f2)
          echo "{\"version\": \"$VERSION\", \"repository\": \"git@github.com:interaction-dynamics/features.git\", \"experimental\": true }" > ../web/public/metadata.json
          echo "Generated metadata.json with version: $VERSION"

      # Setup Node.js for web app
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: projects/web/package.json
      - name: Setup Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install web dependencies 🔧
        working-directory: ./projects/web
        run: bun install --frozen-lockfile

      # The browser download is cached per Playwright version; the system
      # dependencies (apt packages) still install on every run.
      - name: Get Playwright version
        id: playwright-version
        working-directory: ./projects/web
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers 🎭
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./projects/web
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies 🎭
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ./projects/web
        run: bunx playwright install-deps chromium

      - name: Run e2e tests ✔️
        working-directory: ./projects/web
        run: bun run test:e2e

      - name: Upload test results 📤
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: projects/web/playwright-report/
          retention-days: 30
