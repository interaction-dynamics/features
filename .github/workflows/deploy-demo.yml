name: Deploy Demo to GitHub Pages

on:
  workflow_run:
    workflows: ["Valide Code"]
    types:
      - completed
    branches: [master]
  workflow_dispatch:

# Least privilege by default: only the deploy job can write to GitHub Pages
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages reads the Pages site configuration
      pages: read
    if: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Setup Node.js and Bun for web build
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: projects/web/package.json
      - name: Setup Bun cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Setup Rust for CLI
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup Rust cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            projects/cli/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Install web dependencies
      - name: Install web dependencies 🔧
        working-directory: ./projects/web
        run: bun install --frozen-lockfile

      - name: Prepare public folder
        working-directory: ./projects/cli
        run: mkdir -p public

      # Build CLI
      - name: Build CLI 🦀
        working-directory: ./projects/cli
        run: cargo build --release

      # Ensure public directory exists
      - name: Create public directory 📁
        working-directory: ./projects/web
        run: mkdir -p public

      # Generate features JSON
      - name: Generate features data 📊
        working-directory: ./projects/cli
        run: |
          if [ ! -d "../../examples/demo/" ]; then
            echo "Error: demo example directory not found"
            exit 1
          fi
          cargo run --release -- ../../examples/demo/src --project-dir ../../examples/demo --json > ../web/public/features.json
          if [ ! -s "../web/public/features.json" ]; then
            echo "Error: features.json was not generated or is empty"
            exit 1
          fi
          echo "Generated features.json with $(wc -l < ../web/public/features.json) lines"

      # Generate metadata.json with version from Cargo.toml
      - name: Generate metadata.json 📋
        working-directory: ./projects/cli
        run: |
          VERSION=$(grep "^version" Cargo.toml | head -n1 | cut -d'"' -f2)
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "{\"version\": \"$VERSION\", \"repository\": \"git@github.com:interaction-dynamics/features.git\", \"builtAt\": \"$BUILT_AT\" }" > ../web/public/metadata.json
          echo "Generated metadata.json with version: $VERSION"

      # Build web application
      - name: Build web application 🏗️
        working-directory: ./projects/web
        env:
          BASE_URL: "/features"
        run: |
          bun run build
          if [ ! -d "dist" ]; then
            echo "Error: dist directory was not created"
            exit 1
          fi
          if [ ! -f "dist/features.json" ]; then
            echo "Error: features.json not found in dist directory"
            exit 1
          fi
          echo "Build completed successfully. Contents:"
          ls -la dist/
          echo "Features JSON file size: $(wc -c < dist/features.json) bytes"

      # Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Upload artifact
      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./projects/web/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
