name: Release CLI
on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always
  SKIP_PUBLISH: "false"
# Least privilege by default: jobs that publish ask for more below
permissions:
  contents: read
jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    if: startsWith(github.event.head_commit.message, 'release') || github.event_name == 'workflow_dispatch'
    outputs:
      version: ${{ env.version }}
      should_release: ${{ env.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' projects/cli/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "should_release=true" >> $GITHUB_ENV
          echo "Version found: $VERSION"

  validate:
    name: Validate CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            projects/cli/target/
          key: ${{ runner.os }}-cargo-validate-${{ hashFiles('**/Cargo.lock') }}
      - name: Check Formatting 👕
        run: cargo fmt --all -- --check
      - name: Prepare public folder
        run: mkdir -p public
      - name: Clippy 🔍
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build 🔧
        run: cargo build --verbose
      - name: Test ✔️
        run: cargo test --verbose
  build-dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Setup Node.js and pnpm for web build
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install web dependencies 🔧
        run: pnpm install

      - name: Build web application 🏗️
        run: |
          pnpm build
          rm -rf dist/features.json

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public
          path: projects/web/dist/
          if-no-files-found: error

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            code-target: win32-x64
            ext: .exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            code-target: win32-arm64
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            code-target: linux-x64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            code-target: linux-arm64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            code-target: linux-x64-musl
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            code-target: linux-arm64-musl
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            code-target: darwin-x64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            code-target: darwin-arm64
            ext: ""

    name: Build ${{ matrix.code-target }}
    runs-on: ${{ matrix.os }}
    needs:
      - build-dashboard
      - validate
      - check
    if: needs.check.outputs.should_release == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tool
        if: matrix.target != 'x86_64-unknown-linux-gnu' && runner.os == 'Linux'
        run: |
          # Pinned to a reviewed commit of cross-rs/cross main (2026-10-31)
          cargo install cross --git https://github.com/cross-rs/cross --rev a9301e91f72bba3850460512685f6b16062015ff --locked

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: public
          merge-multiple: true
          path: ./public

      - name: Move public directory
        run: |
          mv ./public/ projects/cli/public

      - name: Setup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            projects/cli/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary with cross compilation
        working-directory: projects/cli
        if: matrix.target != 'x86_64-unknown-linux-gnu' && runner.os == 'Linux'
        run: cross build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C strip=symbols -C codegen-units=1"
          FEATURES_VERSION: ${{ needs.check.outputs.version }}
      - name: Build binary for with cargo
        working-directory: projects/cli
        if: matrix.target == 'x86_64-unknown-linux-gnu' || runner.os != 'Linux'
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C strip=symbols -C codegen-units=1"
          FEATURES_VERSION: ${{ needs.check.outputs.version }}
      - name: Copy binary
        run: |
          mkdir -p dist
          cp projects/cli/target/${{ matrix.target }}/release/features${{ matrix.ext }} ./dist/features-${{ matrix.code-target }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: ./dist/features-*
          if-no-files-found: error

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs:
      - build-dashboard
      - validate
      - check
    environment: crates-publish
    permissions:
      contents: read
      # Trusted publishing: exchange a GitHub OIDC token for a short-lived crates.io token
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: public
          merge-multiple: true
          path: ./public

      - name: Move public directory
        run: |
          mv ./public/ projects/cli/public

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Setup cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            projects/cli/target/
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Prepare public folder
        run: mkdir -p projects/cli/public

      - name: Check if version already exists on crates.io
        working-directory: projects/cli
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          if cargo search features-cli --limit 1 | grep -q "\"$VERSION\""; then
            echo "Version $VERSION already exists on crates.io, skipping publish"
            echo "SKIP_PUBLISH=true" >> $GITHUB_ENV
          else
            echo "Version $VERSION not found on crates.io, proceeding with publish"
            echo "SKIP_PUBLISH=false" >> $GITHUB_ENV
          fi

      - name: Dry run publish
        working-directory: projects/cli
        if: env.SKIP_PUBLISH == 'false'
        run: cargo publish --dry-run --allow-dirty
        env:
          FEATURES_VERSION: ${{ needs.check.outputs.version }}

      - name: Authenticate with crates.io
        id: crates-io-auth
        if: env.SKIP_PUBLISH == 'false'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        working-directory: projects/cli
        if: env.SKIP_PUBLISH == 'false'
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          FEATURES_VERSION: ${{ needs.check.outputs.version }}

      - name: Skip publish notification
        if: env.SKIP_PUBLISH == 'true'
        run: |
          echo "::notice::Skipped crates.io publish - version ${{ needs.check.outputs.version }} already exists"

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs:
      - build
      - check
    environment: npm-publish
    permissions:
      contents: read
      # npm trusted publishing and provenance
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all rust artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ./dist

      - name: Install pnpm
        run: |
          npm install -g corepack
          corepack enable
          pnpm --version

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Create npm packages structure
        run: |
          mkdir -p packages/features-cli
          mkdir -p packages/cli-win32-x64
          mkdir -p packages/cli-win32-arm64
          mkdir -p packages/cli-darwin-x64
          mkdir -p packages/cli-darwin-arm64
          mkdir -p packages/cli-linux-x64
          mkdir -p packages/cli-linux-arm64
          mkdir -p packages/cli-linux-x64-musl
          mkdir -p packages/cli-linux-arm64-musl

      - name: Generate platform packages
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # Function to create platform package
          create_platform_package() {
            local platform=$1
            local binary_name=$2
            local os=$3
            local cpu=$4
            local libc=$5

            local pkg_dir="packages/cli-${platform}"
            local pkg_name="@features-cli/feature-cli-${platform}"

            # Copy binary
            cp "dist/features-${platform}${binary_name##*features}" "$pkg_dir/features${binary_name##*features}"
            chmod +x "$pkg_dir/features"* 2>/dev/null || true

            # Create postinstall script
            cat > "$pkg_dir/postinstall.js" << 'POSTINSTALL_EOF'
          #!/usr/bin/env node
          const fs = require('fs');
          const path = require('path');

          // Find the binary file
          const files = fs.readdirSync(__dirname);
          const binaryFile = files.find(f => f.startsWith('features'));

          if (binaryFile) {
            const binaryPath = path.join(__dirname, binaryFile);
            try {
              // Make the binary executable (chmod +x)
              fs.chmodSync(binaryPath, 0o755);
              console.log(`Made ${binaryFile} executable`);
            } catch (err) {
              console.warn(`Warning: Could not make ${binaryFile} executable:`, err.message);
            }
          }
          POSTINSTALL_EOF

            chmod +x "$pkg_dir/postinstall.js"

            # Create package.json
            cat > "$pkg_dir/package.json" << EOF
          {
            "name": "$pkg_name",
            "version": "$VERSION",
            "description": "Features CLI for $platform",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/interaction-dynamics/features"
            },
            "publishConfig": {
                "provenance": true
            },
            "scripts": {
              "postinstall": "node postinstall.js"
            },
            "files": [
              "features*",
              "postinstall.js"
            ],
            "os": ["$os"],
            "cpu": ["$cpu"]$([ -n "$libc" ] && echo ", \"libc\": [\"$libc\"]")
          }
          EOF

            # Create README
            cat > "$pkg_dir/README.md" << EOF
          # Features CLI - $platform

          This package contains the Features CLI binary for $platform.

          This package is not meant to be used directly. Install \`@features/cli\` instead.
          EOF
          }

          # Create all platform packages
          create_platform_package "win32-x64" ".exe" "win32" "x64"
          create_platform_package "win32-arm64" ".exe" "win32" "arm64"
          create_platform_package "darwin-x64" "" "darwin" "x64"
          create_platform_package "darwin-arm64" "" "darwin" "arm64"
          create_platform_package "linux-x64" "" "linux" "x64" "glibc"
          create_platform_package "linux-arm64" "" "linux" "arm64" "glibc"
          create_platform_package "linux-x64-musl" "" "linux" "x64" "musl"
          create_platform_package "linux-arm64-musl" "" "linux" "arm64" "musl"

      - name: Create main package
        run: |
          VERSION="${{ needs.check.outputs.version }}"

          # Create main package.json
          cat > "packages/features-cli/package.json" << 'EOF'
          {
            "name": "features-cli",
            "version": "$VERSION",
            "description": "Map every feature in your codebase: ownership, test coverage, tech debt and git history, as a CLI and web dashboard. Works with any language.",
            "license": "MIT",
            "bin": {
              "features": "bin/features"
            },
            "repository": {
              "type": "git",
              "url": "https://github.com/interaction-dynamics/features"
            },
            "homepage": "https://github.com/interaction-dynamics/features",
            "bugs": {
              "url": "https://github.com/interaction-dynamics/features/issues"
            },
            "keywords": [
              "features",
              "feature-based-architecture",
              "codeowners",
              "code-ownership",
              "technical-debt",
              "test-coverage",
              "architecture",
              "monorepo",
              "dashboard",
              "cli"
            ],
            "files": [
              "bin/features",
              "README.md"
            ],
            "engines": {
              "node": ">=14.0.0"
            },
            "publishConfig": {
                "provenance": true
            },
            "optionalDependencies": {
              "@features-cli/feature-cli-win32-x64": "$VERSION",
              "@features-cli/feature-cli-win32-arm64": "$VERSION",
              "@features-cli/feature-cli-darwin-x64": "$VERSION",
              "@features-cli/feature-cli-darwin-arm64": "$VERSION",
              "@features-cli/feature-cli-linux-x64": "$VERSION",
              "@features-cli/feature-cli-linux-arm64": "$VERSION",
              "@features-cli/feature-cli-linux-x64-musl": "$VERSION",
              "@features-cli/feature-cli-linux-arm64-musl": "$VERSION"
            }
          }
          EOF

          # Replace $VERSION placeholder
          sed -i "s/\$VERSION/$VERSION/g" "packages/features-cli/package.json"

          # Create bin directory and launcher script
          mkdir -p packages/features-cli/bin
          cat > "packages/features-cli/bin/features" << 'EOF'
          #!/usr/bin/env node
          const { platform, arch, env } = process;
          const { execSync } = require("child_process");
          const path = require("path");

          function isMusl() {
            let stderr;
            try {
              stderr = execSync("ldd --version", {
                stdio: ['pipe', 'pipe', 'pipe']
              });
            } catch (err) {
              stderr = err.stderr;
            }
            if (stderr && stderr.indexOf("musl") > -1) {
              return true;
            }
            return false;
          }

          const PLATFORMS = {
            win32: {
              x64: "@features-cli/feature-cli-win32-x64/features.exe",
              arm64: "@features-cli/feature-cli-win32-arm64/features.exe",
            },
            darwin: {
              x64: "@features-cli/feature-cli-darwin-x64/features",
              arm64: "@features-cli/feature-cli-darwin-arm64/features",
            },
            linux: {
              x64: "@features-cli/feature-cli-linux-x64/features",
              arm64: "@features-cli/feature-cli-linux-arm64/features",
            },
            "linux-musl": {
              x64: "@features-cli/feature-cli-linux-x64-musl/features",
              arm64: "@features-cli/feature-cli-linux-arm64-musl/features",
            },
          };

          const binPath = env.FEATURES_BINARY ||
            (platform === "linux" && isMusl()
              ? PLATFORMS?.["linux-musl"]?.[arch]
              : PLATFORMS?.[platform]?.[arch]
            );

          if (binPath) {
            const result = require("child_process").spawnSync(
              require.resolve(binPath),
              process.argv.slice(2),
              {
                shell: false,
                stdio: "inherit",
                env: {
                  ...env,
                },
              },
            );

            if (result.error) {
              throw result.error;
            }

            process.exitCode = result.status;
          } else {
            console.error(
              "The Features CLI package doesn't ship with prebuilt binaries for your platform yet. " +
                "You can build from source by cloning the repository and following the build instructions.",
            );
            process.exitCode = 1;
          }
          EOF

          chmod +x packages/features-cli/bin/features

          # Use the repository README so the npm page matches GitHub
          cp README.md packages/features-cli/README.md

      - name: Publish platform packages
        run: |
          for pkg in packages/cli-*; do
            echo "Publishing $pkg..."
            pnpm publish "$pkg" --access public --tag latest --no-git-checks
          done
      - name: Publish main package
        run: |
          echo "Publishing main package..."
          pnpm publish "packages/features-cli" --access public --no-git-checks
  github-release:
    name: Github Release
    runs-on: ubuntu-latest
    permissions:
      # Create the release and tag
      contents: write
    needs:
      - publish-crate
      - publish-npm
      - check
    steps:
      - name: Download all rust artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: ./dist

      - name: Generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          assets=(features-*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release binaries found in dist/"
            exit 1
          fi
          sha256sum "${assets[@]}" > checksums.txt
          for asset in "${assets[@]}"; do
            sha256sum "$asset" > "$asset.sha256"
          done
          cat checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: CLI v${{ needs.check.outputs.version }}
          draft: false
          tag_name: v${{ needs.check.outputs.version }}
          fail_on_unmatched_files: true
          files: |
            dist/features-*
            dist/checksums.txt
          body: |
            ## Installation

            ### Via Cargo (Rust)
            ```bash
            cargo install features-cli
            ```

            ### Via Homebrew (macOS, Linux)
            ```bash
            brew install interaction-dynamics/tap/features
            ```

            ### Via npm
            ```bash
            npx features-cli /path/to/project
            # or install globally
            npm install -g features-cli
            ```

            ### Download Binary
            Download the appropriate binary for your platform from the attachments below,
            and verify it against `checksums.txt` (`sha256sum -c checksums.txt --ignore-missing`).
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - github-release
      - check
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check for tap token
        id: token
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, skipping the Homebrew tap update"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release checksums
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "v$VERSION" --pattern checksums.txt --dir "$RUNNER_TEMP"

      - name: Render formula
        if: steps.token.outputs.present == 'true'
        run: projects/cli/packaging/homebrew/render.sh "$VERSION" "$RUNNER_TEMP/checksums.txt" "$RUNNER_TEMP/features.rb"

      - name: Checkout tap repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: interaction-dynamics/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Commit and push formula
        if: steps.token.outputs.present == 'true'
        working-directory: homebrew-tap
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/features.rb" Formula/features.rb
          if git diff --quiet --exit-code -- Formula/features.rb && git ls-files --error-unmatch Formula/features.rb >/dev/null 2>&1; then
            echo "Formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/features.rb
          git commit -m "features $VERSION"
          git push
